<!DOCTYPE html>
<!--
  Dev-only BPMN viewer for eyeballing bpmnfmt output.

  Usage:
    python3 -m http.server 8077          # from the repo root
    open http://localhost:8077/hack/viewer/?f=testdata/tour-execution.bpmn
    open http://localhost:8077/hack/viewer/?f=/tmp/out.bpmn  (must be under the served root)
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>bpmnfmt viewer</title>
  <script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-navigated-viewer.development.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #info { position: fixed; top: 6px; left: 8px; font: 12px monospace; background: #ffffffcc; padding: 2px 6px; z-index: 10; }
    #canvas { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="info"></div>
  <div id="canvas"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get('f');
    const info = document.getElementById('info');
    info.textContent = file || 'pass ?f=<path>';
    const viewer = new BpmnJS({ container: '#canvas' });
    window.viewer = viewer;
    if (file) {
      fetch('/' + file.replace(/^\//, ''))
        .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text(); })
        .then(xml => viewer.importXML(xml))
        .then(() => {
          viewer.get('canvas').zoom('fit-viewport');
          document.title = 'OK: ' + file;
          window.__rendered = true;
        })
        .catch(e => {
          info.textContent = 'ERROR ' + file + ': ' + e.message;
          document.title = 'ERROR: ' + file;
          window.__rendered = false;
        });
    }
  </script>
</body>
</html>
