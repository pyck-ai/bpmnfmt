name: release

# Publishing a Go module = the git tag + the proxy caching that version.
#
# This repo has immutable releases enabled: once a release is PUBLISHED its
# assets are frozen, and uploading to it fails with "HTTP 422: Cannot upload
# assets to an immutable release". So the binaries have to be attached while
# the release is still a draft — which means the workflow cannot run on
# `release: published` and append to it afterwards.
#
# It runs on the tag push instead and leaves a DRAFT behind:
#
#   1. git tag v1.2.3 && git push origin v1.2.3
#   2. this workflow tests, cross-compiles, and creates the draft release
#      with every archive already attached (notes auto-generated as a
#      starting point)
#   3. edit the notes and hit Publish — the assets are already in place, so
#      immutability has nothing to reject
#
# Re-running is safe: an existing DRAFT gets its assets replaced, while an
# already-published tag fails loudly rather than pretending to succeed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a draft release for (e.g. v1.2.3)'
        required: true

permissions:
  contents: write # create the draft release and upload its assets

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
          cache: false
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; echo "::error::gofmt found unformatted files"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
          cache: false
      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="$TAG"
          if [ -z "$VERSION" ]; then echo "::error::no tag to build"; exit 1; fi
          name="bpmnfmt_${VERSION}_${GOOS}_${GOARCH}"
          bin=bpmnfmt
          [ "$GOOS" = windows ] && bin=bpmnfmt.exe
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$bin" ./cmd/bpmnfmt
          mkdir -p dist
          if [ "$GOOS" = windows ]; then
            zip "dist/${name}.zip" "$bin" README.md LICENSE
          else
            tar -czf "dist/${name}.tar.gz" "$bin" README.md LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  draft-release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * | tee checksums.txt
      - name: Create the draft release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; immutable releases refuse new assets. Cut a new tag."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --draft \
              --title "$TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "::notice::Draft release $TAG is ready with its assets — edit the notes and publish it."

  publish-module:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Warm the Go module proxy
        run: |
          VERSION="$TAG"
          mod=github.com/pyck-ai/bpmnfmt
          echo "Requesting ${mod}@${VERSION} from proxy.golang.org…"
          if curl -fsSL "https://proxy.golang.org/${mod}/@v/${VERSION}.info"; then
            echo
            echo "Published: go get ${mod}@${VERSION}"
          else
            echo "::warning::proxy could not fetch ${mod}@${VERSION} — expected for a private repo; consumers set GOPRIVATE=github.com/pyck-ai/* and fetch the tag directly"
          fi
